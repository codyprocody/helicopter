server {
    listen 80;
    listen [::]:80;
    server_name helicopter.superbyte.eu;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helicopter.superbyte.eu;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/helicopter.superbyte.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helicopter.superbyte.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /opt/projects/helicopter/public;
    index index.html;

    location = / {
        limit_except GET HEAD { deny all; }
        expires -1;
    }

    location = /index.html {
        limit_except GET HEAD { deny all; }
        expires -1;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}
